name: HUNTER MESSAGE Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub ubuntu-latest already includes Android SDK.
      # Avoid setup-android@v3, which failed during SDK tool/license setup.
      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          test -d "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" || exit 1
      - name: Verify project structure
        shell: bash
        run: |
          echo "Repository root:"
          pwd
          ls -la
          test -f package.json || { echo "ERROR: package.json must be at repository root"; exit 1; }
          test -f src/main.tsx || { echo "ERROR: src/main.tsx missing. Upload the CONTENTS of the ZIP at repository root, not inside an extra folder."; exit 1; }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Web and sync Android
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_ENABLE_STORAGE: ${{ secrets.VITE_ENABLE_STORAGE }}
        run: |
          npm run build
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Configure Android FCM (optional, Google services file)
        env:
          ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}
        shell: bash
        run: |
          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$ANDROID_GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
            python3 -m json.tool android/app/google-services.json > /dev/null
            echo "Android FCM config applied"
          else
            echo "Android FCM is not configured. APK builds, push won't work until Android Firebase app + google-services.json are added."
          fi
      - name: Enable Android microphone permission
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          if '<application' not in source:
              raise SystemExit('AndroidManifest.xml application tag not found')
          for permission in permissions:
              if permission not in source:
                  source = source.replace('<application', permission + '\n    <application', 1)
          manifest.write_text(source)
          print('Android voice permissions present')
          PYCODE
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hunter-message-debug-apk
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk
